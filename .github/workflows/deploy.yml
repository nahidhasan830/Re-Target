name: Deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: re-target-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Deploy and verify
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
          CAMPAIGN_TEST_NUMBERS: ${{ secrets.CAMPAIGN_TEST_NUMBERS }}
          COURIER_ENCRYPTION_KEY: ${{ secrets.COURIER_ENCRYPTION_KEY }}
          WAHA_BASE_URL: ${{ secrets.WAHA_BASE_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          WHATSAPP_WEBHOOK_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}
          MEDIA_PREPARATION_KEY: ${{ secrets.MEDIA_PREPARATION_KEY }}
          DATABASE_BACKUP_PUBLIC_KEY: ${{ secrets.DATABASE_BACKUP_PUBLIC_KEY }}
      - name: Preserve encrypted database backup
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/*.encrypted.json
          if-no-files-found: ignore
          retention-days: 7
